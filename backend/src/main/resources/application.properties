# ===== COMMON settings: same on every machine =====
spring.application.name=backend
server.port=8081

# no profile given → use "dev" (a real server must set SPRING_PROFILES_ACTIVE=prod)
spring.profiles.default=dev

# Flyway owns the schema (src/main/resources/db/migration).
# Hibernate only VALIDATES that entities match the tables; it never changes them.
spring.jpa.hibernate.ddl-auto=validate

localmart.jwt.expiry-seconds=3600

# nobody can ask for more than 50 items in one page (protects the server from ?size=1000000)
spring.data.web.pageable.max-page-size=50

# ===== Actuator =====
# expose ONLY health over HTTP. /env, /heapdump, /beans... stay hidden (they can leak secrets).
management.endpoints.web.exposure.include=health
# public sees only {"status":"UP"}; details (DB, disk) only for a logged-in ADMIN
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
# adds /actuator/health/liveness and /readiness (used by Docker/Kubernetes)
management.endpoint.health.probes.enabled=true
