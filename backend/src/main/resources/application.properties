spring.application.name=backend
server.port=8081

# Database (Postgres running in Docker on port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/localmart
spring.datasource.username=localmart
spring.datasource.password=localmart123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT: in production the secret comes from the JWT_SECRET environment variable.
# The value after ":" is only a local-dev fallback (must be at least 32 characters for HS256).
localmart.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-in-prod-123456}
localmart.jwt.expiry-seconds=3600
