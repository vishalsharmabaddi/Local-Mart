# ===== COMMON settings: same on every machine =====
spring.application.name=backend
server.port=8081

# no profile given → use "dev" (a real server must set SPRING_PROFILES_ACTIVE=prod)
spring.profiles.default=dev

# Flyway owns the schema (src/main/resources/db/migration).
# Hibernate only VALIDATES that entities match the tables; it never changes them.
spring.jpa.hibernate.ddl-auto=validate

localmart.jwt.expiry-seconds=3600
