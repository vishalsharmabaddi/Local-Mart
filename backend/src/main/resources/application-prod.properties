# ===== PROD profile: the real server =====
# No real values here: everything comes from environment variables set on the server.
# No ":default" on purpose → if a variable is missing, the app REFUSES to start (fail fast).

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

localmart.jwt.secret=${JWT_SECRET}
